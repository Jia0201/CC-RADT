<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC-RADT 独立升级器 · 交互原型</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#222b30;background:#f4f6f5;font-size:14px;letter-spacing:0;--green:#12684e;--muted:#65716c;--line:#dce3df}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button,input,select{border:1px solid var(--line);border-radius:6px;padding:10px 14px;background:#fff;color:inherit}button:hover:not(:disabled){background:#edf4f0}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #80b99f;outline-offset:3px}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.primary:hover{background:#0e503c}a{color:var(--green)}.prototype{padding:10px 28px;background:#e8edea;color:#46574e;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px}.prototype label{display:flex;align-items:center;gap:10px}.prototype select{padding:5px 8px;font-size:12px}.top{background:white;border-bottom:1px solid var(--line);padding:24px 36px;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:750;font-size:19px}.brand span{font-weight:400;font-size:14px;color:var(--muted);margin-left:16px}.badge{padding:5px 10px;background:#edf5f0;border-radius:4px;color:var(--green);font-size:12px}.layout{max-width:1260px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 123px)}aside{border-right:1px solid var(--line);padding:35px 24px}.step{padding:14px 10px;display:flex;align-items:center;gap:12px;color:#748078;border-radius:6px;margin-bottom:8px}.step i{font-style:normal;border:1px solid #cbd6cf;border-radius:50%;height:26px;width:26px;display:grid;place-items:center;font-size:12px;flex-shrink:0}.step.active{background:#e5eee8;color:var(--green);font-weight:650}.step.active i{background:var(--green);border-color:var(--green);color:white}.aside-note{margin-top:42px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:12px;line-height:1.9}.aside-note strong{display:block;color:#34443a;font-size:13px}.content{padding:38px 42px 28px;min-width:0}.eyebrow{font-size:12px;color:var(--green);font-weight:650;margin:0 0 10px}h1{font-size:27px;margin:0 0 10px;font-weight:650}h2{font-size:16px;margin:0 0 14px;font-weight:650}p{line-height:1.7}.sub{color:var(--muted);margin:0 0 28px}.versions{display:flex;gap:24px;align-items:center;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:22px 0 26px}.versions small{color:var(--muted);display:block;margin-bottom:6px}.version{font-size:24px;font-weight:600}.arrow{color:#83948b;font-size:22px}.green{color:var(--green)}.form-row{margin-bottom:22px}.form-row label{display:block;font-size:13px;font-weight:600;margin-bottom:9px}.form-row input,.form-row select{width:100%}.form-row small{display:block;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}.notice{background:#edf5ef;border-left:3px solid #2d8c65;padding:14px 16px;margin:20px 0;line-height:1.75}.notice.warn{background:#fdf0ee;border-left-color:#bf4c3c;color:#893a31}.notice strong{display:block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:26px}.metric{padding:17px;background:#fff;border:1px solid var(--line);border-radius:6px}.metric strong{font-size:26px;display:block;font-weight:600;margin-bottom:5px}.metric span{color:var(--muted);font-size:12px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:13px 15px;text-align:left;border-bottom:1px solid #e9eeeb}th{font-size:12px;color:var(--muted);font-weight:500;background:#fafbfa}tr:last-child td{border:0}.path{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}.footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.footer .actions{display:flex;gap:10px;flex-wrap:wrap}.footnote{font-size:12px;color:var(--muted)}.checkline{display:flex;gap:10px;align-items:flex-start;margin-top:24px;line-height:1.6;font-size:13px}.checkline input{margin-top:4px}.progress{height:6px;background:#dce8df;border-radius:4px;overflow:hidden;margin:24px 0}.progress span{display:block;height:100%;background:#287b54;transition:width .25s}.activity{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;justify-content:space-between}.activity small{color:var(--muted)}.activity.done{color:var(--green)}.route{display:flex;align-items:center;gap:12px;padding:15px 0;flex-wrap:wrap}.route span{padding:8px 13px;background:#fff;border:1px solid var(--line);border-radius:5px}.details{margin-top:20px}.details summary{cursor:pointer;font-size:13px;color:var(--muted)}.details p{font-size:13px;color:var(--muted)}.success-mark{font-size:30px;background:#e0eee5;color:var(--green);width:58px;height:58px;display:grid;place-items:center;border-radius:50%;margin:8px 0 22px}.conflict{padding:18px 0;border-top:1px solid var(--line)}.conflict h2{font-size:14px;margin-bottom:8px}.conflict p{font-size:13px;color:var(--muted);margin:0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.pair div{padding:14px;background:#fff;border:1px solid var(--line);border-radius:5px}.pair small{display:block;color:var(--muted);margin-bottom:7px}.bottom{font-size:11px;color:#718178;text-align:center;padding:16px}.empty{padding:26px 0;color:var(--muted)}[hidden]{display:none!important}@media(max-width:760px){.top{padding:18px}.brand span{display:block;margin:4px 0 0}.prototype{padding:10px 18px}.layout{display:block}aside{padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}.steps{display:flex;overflow:auto;gap:6px}.step{padding:7px;margin:0;white-space:nowrap;font-size:12px;gap:6px}.step i{width:21px;height:21px}.aside-note{display:none}.content{padding:26px 18px}h1{font-size:24px}.grid{gap:7px}.metric{padding:12px}.metric strong{font-size:22px}.pair{grid-template-columns:1fr}.footer .primary{flex-grow:1}.versions{gap:20px}.badge{white-space:nowrap}.table-wrap td{min-width:110px}.table-wrap td:first-child{min-width:160px}}
</style>
</head>
<body>
<div class="prototype"><span>交互原型 · 所有数据为演示，不读取或修改项目文件</span><label>预览场景<select id="scenario"><option value="normal">正常升级</option><option value="conflict">本地定制冲突</option><option value="recovery">中断后恢复</option><option value="cross">跨版本迁移（规划）</option></select></label></div>
<header class="top"><div class="brand">CC-RADT <span>独立升级器</span></div><span class="badge">本机操作</span></header>
<div class="layout"><aside><nav class="steps" aria-label="升级步骤"></nav><div class="aside-note"><strong>已有内容，始终保留</strong>原件单独留存<br>迁移在副本中进行<br>冲突时停止切换<br>恢复无需启动团队</div></aside><main class="content" id="content" aria-live="polite"></main></div>
<div class="bottom">CC-RADT Updater · Windows / macOS / Linux 设计方案</div>
<script>
'use strict';
const content=document.querySelector('#content');
const scenario=document.querySelector('#scenario');
let page='project', project='D:\\Projects\\bots', timer=null, percent=0, busy=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function target(){return scenario.value==='cross'?'2.0.0':'1.1.0'}
function nav(n){document.querySelector('.steps').innerHTML=['选择项目','升级预览','执行升级','完成'].map((s,i)=>`<div class="step ${i===n?'active':''}"><i>${i+1}</i>${s}</div>`).join('')}
function versions(){return `<div class="versions"><div><small>当前安装</small><div class="version">v1.0.0</div></div><div class="arrow" aria-hidden="true">→</div><div><small>目标版本</small><div class="version green">v${target()}</div></div></div>`}
function footer(text,buttons){return `<div class="footer"><span class="footnote">${text}</span><div class="actions">${buttons}</div></div>`}
function btn(action,text,primary=false){return `<button data-action="${action}" class="${primary?'primary':''}">${text}</button>`}
function reset(){clearInterval(timer);busy=false;percent=0;scenario.disabled=false;page=scenario.value==='recovery'?'recovery':'project';render()}
function render(){
if(page==='project'){
nav(0);content.innerHTML=`<p class="eyebrow">准备升级</p><h1>选择你的项目</h1><p class="sub">升级团队能力，延续当前项目的记忆与工作记录。</p><div class="form-row"><label for="project-path">目标项目目录</label><input id="project-path" value="${esc(project)}" autocomplete="off"><small>Harness 位置：.claude/ai-teams</small></div><div class="form-row"><label for="source">安装包来源</label><select id="source"><option>GitHub Release · v${target()}（演示）</option><option>本地安装包（演示）</option></select><div id="local-field" hidden><label for="local-path" style="margin-top:14px">本地包路径</label><input id="local-path" placeholder="粘贴已下载的正式包路径"></div></div>${versions()}<div class="notice">项目画像、长期记忆、任务记录与本地定制将保留。升级前需要退出该项目的 Claude Code 与后台写入任务。</div>${footer('项目：bots · 示例安装',btn('preview','查看升级预览',true))}`;
document.querySelector('#source').onchange=e=>document.querySelector('#local-field').hidden=e.target.selectedIndex===0;
}else if(page==='preview'){
nav(1);content.innerHTML=`<p class="eyebrow">升级预览</p><h1>新版就绪，已有内容保留</h1><p class="sub">项目：${esc(project)} · 本页数量均为示例</p>${versions()}${scenario.value==='cross'?'<div class="notice"><strong>跨版本路线 · 规划演示</strong>一次操作，依次迁移数据格式。实际支持需对应版本迁移测试通过。</div><div class="route"><span>数据格式 1</span>→<span>数据格式 2</span>→<span>数据格式 3</span></div>':''}<div class="grid"><div class="metric"><strong>1,286</strong><span>已有文件保留</span></div><div class="metric"><strong>42</strong><span>官方文件新增 / 更新</span></div><div class="metric"><strong>3</strong><span>旧文件停用并留档</span></div></div><div class="table-wrap"><table><thead><tr><th>内容</th><th>处理</th><th>状态</th></tr></thead><tbody><tr><td>项目资料与全部记忆</td><td>保留原内容</td><td class="green">无冲突</td></tr><tr><td>任务、会话与本地扩展</td><td>保留并关联索引</td><td class="green">无冲突</td></tr><tr><td>Claude 配置与 MCP</td><td>仅合并团队受管字段</td><td class="green">可合并</td></tr><tr><td>官方工具与 Hooks</td><td>更新为 v${target()}</td><td class="green">可更新</td></tr></tbody></table></div><details class="details"><summary>备份与来源信息</summary><p>恢复原件：项目同卷的 .cc-radt-upgrades / 本次事务<br>来源签名、构建身份、可用空间：演示通过<br>恢复原件不会自动清理。</p></details><label class="checkline"><input type="checkbox" id="quiet">我已退出该项目的 Claude Code、子 Agent 及其他写入任务。</label>${footer('确认后先保护原件，再处理新版副本',btn('project','返回')+'<button data-action="start" class="primary" id="start" disabled>开始升级（演示）</button>')}`;
document.querySelector('#quiet').onchange=e=>document.querySelector('#start').disabled=!e.target.checked;
}else if(page==='conflict'){
nav(1);content.innerHTML=`<p class="eyebrow">需要处理冲突</p><h1>本地定制与新版发生冲突</h1><p class="sub">升级已停止，当前安装和项目内容保持原样。</p><div class="notice warn"><strong>2 项内容无法可靠合并</strong>保留两边内容，导出差异并处理后重新扫描。这里没有强制覆盖入口。</div><div class="conflict"><h2 class="path">.claude/agents/qa.md</h2><p>QA 职责在项目和新版本中均有调整。</p><div class="pair"><div><small>本地定制</small>新增支付回归必检项</div><div><small>官方新版</small>新增审查结果合同</div></div></div><div class="conflict"><h2 class="path">.claude/settings.json</h2><p>同一 Hook 的本地参数与新版入口同时变化。</p><div class="pair"><div><small>本地定制</small>自定义运行参数</div><div><small>官方新版</small>新的启动入口</div></div></div>${footer('尚未切换任何活动文件',btn('export','导出冲突报告')+btn('cancel','取消升级')+btn('preview','重新扫描',true))}`;
}else if(page==='running'){
nav(2);const labels=['保护并核对原安装','构建新版副本','合并配置与数据迁移','检查候选内容','切换安装与外层配置'];content.innerHTML=`<p class="eyebrow">正在执行 · 模拟进度</p><h1>${percent<80?'正在准备新版副本':'正在切换安装'}</h1><p class="sub">已有内容保存在独立恢复目录中。</p><div class="versions"><div class="version">v1.0.0</div><span class="arrow">→</span><div class="version green">v${target()}</div><span style="margin-left:auto">${percent}%</span></div><div class="progress" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100"><span style="width:${percent}%"></span></div>${labels.map((s,i)=>`<div class="activity ${percent>=(i+1)*20?'done':''}"><span>${s}</span><small>${percent>=(i+1)*20?'已完成':percent>=i*20?'进行中':'等待'}</small></div>`).join('')}${footer('演示不会对磁盘执行任何升级操作',btn('interrupt','模拟执行中断')+btn('cancel',percent<80?'取消升级':'安全停止并恢复'))}`;
}else if(page==='recovery'){
nav(2);content.innerHTML=`<p class="eyebrow">发现未完成的升级</p><h1>先恢复一致的安装状态</h1><p class="sub">事务 UP-20260908-001 · v1.0.0 → v${target()}</p><div class="notice warn"><strong>上次在配置切换阶段中断</strong>旧安装原件、新版副本和操作记录均已保留。恢复工具独立运行，无需启动 Claude Code。</div><div class="table-wrap"><table><tbody><tr><td>原安装恢复材料</td><td class="green">完整（演示）</td></tr><tr><td>中断后新写入内容</td><td>未发现（演示）</td></tr><tr><td>恢复目标</td><td>v1.0.0</td></tr><tr><td>事务状态</td><td>等待恢复</td></tr></tbody></table></div><p class="footnote">真实执行中如发现新写入内容，会先保留并停止自动覆盖。</p>${footer('恢复后可重新发起升级',btn('export','导出恢复信息')+btn('restore','恢复原安装（演示）',true))}`;
}else if(page==='complete'||page==='restored'){
nav(3);const restored=page==='restored';content.innerHTML=`<div class="success-mark" aria-hidden="true">✓</div><p class="eyebrow">${restored?'恢复完成':'升级完成'} · 演示结果</p><h1>${restored?'原安装已恢复':'已升级到 v'+target()}</h1><p class="sub">${restored?'当前版本 v1.0.0，项目内容与本地定制已保留。':'重新打开 Claude Code，即可继续当前项目，无需重新初始化。'}</p><div class="table-wrap"><table><tbody><tr><td>项目资料、记忆和工作记录</td><td class="green">保留</td></tr><tr><td>本地配置与扩展</td><td class="green">保留</td></tr><tr><td>恢复材料</td><td>继续留存，不自动清理</td></tr><tr><td>结果报告</td><td>可导出</td></tr></tbody></table></div><div class="notice">这个页面是交互原型，没有修改真实项目。</div>${footer('所有示例均可重新体验',btn('export','导出示例报告')+btn('reset','返回首页',true))}`;
}else{
nav(0);content.innerHTML=`<p class="eyebrow">操作已取消 · 演示</p><h1>当前安装保持原样</h1><p class="sub">已有内容和恢复材料均保留。</p>${footer('可以稍后重新发起',btn('reset','返回首页',true))}`;
}}
content.addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;
if(action==='export'){const blob=new Blob([JSON.stringify({prototype:true,scenario:scenario.value,page,project,from:'1.0.0',to:target(),note:'模拟报告，未执行真实扫描或升级'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cc-radt-upgrade-prototype-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}
if(action==='reset'){reset();return}
if(action==='preview'){const input=document.querySelector('#project-path');if(input){if(!input.value.trim()){input.focus();input.setCustomValidity('请输入项目路径');input.reportValidity();return}project=input.value.trim()}page=scenario.value==='conflict'?'conflict':'preview'}
else if(action==='start'){busy=true;scenario.disabled=true;page='running';percent=0;timer=setInterval(()=>{percent+=10;if(percent>=100){clearInterval(timer);busy=false;scenario.disabled=false;page='complete'}render()},600)}
else if(action==='interrupt'){clearInterval(timer);busy=false;scenario.disabled=false;page='recovery'}
else if(action==='cancel'){clearInterval(timer);const duringSwitch=busy&&percent>=80;busy=false;scenario.disabled=false;page=duringSwitch?'recovery':'cancelled'}
else if(action==='restore'){page='restored'}else{page=action}render()});
scenario.addEventListener('change',reset);render();
</script>
</body>
</html>
